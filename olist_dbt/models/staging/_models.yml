version: 2

models:
  - name: stg_customers
    description: "This dataset has information about the customer ans its location. Use it to indetify unique customers in the orders dataset and to find the orders delivery location."
    columns:
      - name: customer_id
        description: "key to the orders dataset. Each order has a unique customer_id."
        tests:
          - unique
          - not_null
      
      - name: customer_unique_id
        description: "Unique identifier of a customer."
      
      - name: zip_code_prefix
        description: "First five digits of customer zip code."
      
      - name: customer_city
        description: "Customer city name."
      
      - name: customer_state
        description: "Customer state."
  
  - name: stg_geolocation
    description: "This dataset has information Brazilian zip codes and its lat/lng coordinates. Use it to plot maps and fin distances between sellers and customers."
    columns:
      - name: geolocation_zip_code_prefix
        description: "First 5 digits pf zip code."
        tests:
          - not_null
      
      - name: geolocation_lat
        description: "Latitude"

      - name: geolocation_lng
        description: "Longitude"

      - name: geolocation_city
        description: "City name"
      
      - name: geolocation_state
        description: "State"

  - name: stg_order_items
    description: "This dataset includes data about the items purchased within each order."
    columns:
      - name: order_id
        description: "order unique identifier."
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: order_item_id
        description: "sequential number identifying number of items included in the same order."
      
      - name: product_id
        description: "product unique identifier."
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      
      - name: seller_id
        description: "seller unique identifier."
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id
      
      - name: shipping_limit_date
        description: "Shows the seller shipping limit date for handling the order over to the logistic partner."
      
      - name: price
        description: "item price."

      - name: freight_value
        description: "item freight value item."
  
  - name: stg_order_payments
    description: "This dataset includes data about the orders payment options."
    columns:
      - name: order_id
        description: "Unique identifier of an order."
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: payment_sequential
        description: "A customer may pay an order with more than one payment method. If he does so, a sequence will be created to."
      
      - name: payment_type
        description: "Method of payment chosen by the customer."
      
      - name: payment_installments
        description: "Number of installments chosen by the customer."

      - name: payment_value
        description: "Transaction value."

  - name: stg_order_reviews
    description: "This dataset includes data about the reviews made by the customers."
    columns:
      - name: review_id
        description: "Unique review identifier. Note: source data contains duplicate review_ids (known Olist data quirk)."
        tests:
          - not_null
      
      - name: order_id
        description: "Unique order identifier."
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      
      - name: review_score
        description: "Note rating from 1 to 5 given by the customer on satisfication survey."
        tests:
          - accepted_values:
              values:
                - 1
                - 2
                - 3
                - 4
                - 5

      - name: review_comment_title
        description: "Comment title from the review left by the customer, in Portuguese."

      - name: review_comment_message
        description: "Comment message from the review left by the customer, in Portuguese."

      - name: review_creation_date
        description: "Shows the date in which the satisfaction survey was sent to the customer."

      - name: review_answer_timestamp
        description: "Shows satisfaction survey answer timestamp."

  - name: stg_orders
    description: "This is the core dataset. From each order you might find all other information."
    columns:
      - name: order_id
        description: "Unique identifier oh the order"
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Key to the customer dataset. Each ordar has a unique customer_id"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: order_status
        description: "Reference the order status (delivered, shipped, etc)"
      
      - name: order_purchase_timestamp
        description: "Shows the purchase timestamp."

      - name: order_approved_at
        description: "Shows the payment approval timestamp."

      - name: order_delivered_carrier_date
        description: "Shows the order posting timestamp. When it was handled to the logistic partner."

      - name: order_delivered_customer_date
        description: "Shows the actual order delivery date to the customer."
      
      - name: order_estimated_delivery_date
        description: "Shows the estimated delivery date that was informed to customer at the purchase moment."
      
  - name: stg_products_category
    description: "Translates the product_category_name to english."
    columns:
      - name: product_category_name
        description: "Category name in Portuguese."
      
      - name: product_category_name_english
        description: "Category name in English."
  
  - name: stg_products
    description: "This dataset includes data about the products sold by Olist"
    columns:
      - name: product_id
        description: "Unique product identifier"
        tests:
          - not_null
          - unique
      
      - name: product_category_name
        description: "Root category of product, in Portuguese."

      - name: product_name_lenght
        description: "Number of characters extracted from the product name."

      - name: product_description_lenght
        description: "Number of characters extracted from the product description."
      
      - name: product_photos_qty
        description: "Number of product published photos."
      
      - name: product_weight_g
        description: "Product weight measured in grams."

      - name: product_length_cm
        description: "Product length measured in centimeters."

      - name: product_height_cm
        description: "Product height measured in centimeters."
      
      - name: product_width_cm
        description: "Product width measured in centimeters."

  - name: stg_sellers
    description: "This dataset includes data about the sellers fuifilled orders made at Olist. Use it to fin the seller location and to identify which seller fulfilled each product"
    columns:
      - name: seller_id
        description: "Seller unique identifier."
        tests:
          - not_null
          - unique
      
      - name: seller_zip_code_prefix
        description: "First 5 digits of seller zip code."
      
      - name: seller_city
        description: "Seller city name."
      
      - name: seller_state
        description: "Seller state."